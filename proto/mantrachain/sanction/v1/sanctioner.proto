syntax = "proto3";
package mantrachain.sanction.v1;

import "cosmos_proto/cosmos.proto";

option go_package = "github.com/MANTRA-Chain/mantrachain/v8/x/sanction/types";

// SanctionerRole defines what a sanctioner is allowed to do.
enum SanctionerRole {
  // SANCTIONER_ROLE_UNSPECIFIED is invalid for a sanctioner. In events it
  // marks an action taken by governance.
  SANCTIONER_ROLE_UNSPECIFIED = 0;
  // SANCTIONER_ROLE_FULL can add and remove sanctioned addresses, and can
  // revoke an add-only sanctioner.
  SANCTIONER_ROLE_FULL = 1;
  // SANCTIONER_ROLE_ADD_ONLY can only add sanctioned addresses.
  SANCTIONER_ROLE_ADD_ONLY = 2;
}

// Sanctioner is an address appointed by governance to change the sanction
// list without a governance proposal.
message Sanctioner {
  string address = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  SanctionerRole role = 2;
}

// SanctionRecord records who sanctioned an address, why, and when. Entries
// that predate sanctioners have no record and are treated as governance
// entries.
message SanctionRecord {
  // actor is the sanctioner or governance authority that added the entry.
  string actor = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // actor_role is the actor's role at the time, or UNSPECIFIED for
  // governance.
  SanctionerRole actor_role = 2;
  string reason = 3;
  int64 height = 4;
}

// SanctionedAddress pairs a sanctioned address with its record, if any.
message SanctionedAddress {
  string address = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // record is empty for entries added before sanctioners existed.
  SanctionRecord record = 2;
}
