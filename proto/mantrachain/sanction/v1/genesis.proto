syntax = "proto3";
package mantrachain.sanction.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "mantrachain/sanction/v1/params.proto";
import "mantrachain/sanction/v1/sanctioner.proto";

option go_package = "github.com/MANTRA-Chain/mantrachain/v8/x/sanction/types";

// GenesisState defines the sanction module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];

  repeated string blacklist_accounts = 2
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];

  // sanctioners is the initial sanctioner list. Empty keeps the module
  // governance-only.
  repeated Sanctioner sanctioners = 3 [ (gogoproto.nullable) = false ];
}
