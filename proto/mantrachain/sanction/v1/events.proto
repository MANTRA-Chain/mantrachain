syntax = "proto3";
package mantrachain.sanction.v1;

import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "mantrachain/sanction/v1/sanctioner.proto";

option go_package = "github.com/MANTRA-Chain/mantrachain/v8/x/sanction/types";

// EventSanctionListChanged is emitted once per address whenever the sanction
// list changes, whoever made the change.
message EventSanctionListChanged {
  string address = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // sanctioned is true when the address was added, false when removed.
  bool sanctioned = 2;
  // actor is the sanctioner or governance authority that made the change.
  string actor = 3 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // actor_role is UNSPECIFIED when the actor is governance. Alerting can
  // filter on SANCTIONER_ROLE_ADD_ONLY to review automated entries.
  SanctionerRole actor_role = 4;
  string reason = 5;
  int64 height = 6;
}

// EventSanctionersUpdated is emitted when governance replaces the sanctioner
// list.
message EventSanctionersUpdated {
  repeated Sanctioner sanctioners = 1 [ (gogoproto.nullable) = false ];
  int64 height = 2;
}

// EventSanctionerRevoked is emitted when a full sanctioner revokes an
// add-only sanctioner.
message EventSanctionerRevoked {
  string address = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string revoked_by = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string reason = 3;
  int64 height = 4;
}
