syntax = "proto3";

package mantrachain.sanction.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "mantrachain/sanction/v1/params.proto";
import "mantrachain/sanction/v1/sanctioner.proto";

option go_package = "github.com/MANTRA-Chain/mantrachain/v8/x/sanction/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
  // UpdateSanctioners defines a (governance) operation that replaces the whole
  // sanctioner list.
  rpc UpdateSanctioners(MsgUpdateSanctioners)
      returns (MsgUpdateSanctionersResponse);

  // SanctionAddresses adds addresses to the sanction list. The signer is the
  // gov authority or a sanctioner with any role.
  rpc SanctionAddresses(MsgSanctionAddresses)
      returns (MsgSanctionAddressesResponse);
  // UnsanctionAddresses removes addresses from the sanction list. The signer
  // is the gov authority or a full sanctioner.
  rpc UnsanctionAddresses(MsgUnsanctionAddresses)
      returns (MsgUnsanctionAddressesResponse);
  // RevokeSanctioner lets a full sanctioner remove an add-only sanctioner from
  // the sanctioner list.
  rpc RevokeSanctioner(MsgRevokeSanctioner)
      returns (MsgRevokeSanctionerResponse);
}

// MsgAddBlacklistAccounts is deprecated and can no longer be executed. Use
// MsgSanctionAddresses signed by the gov authority. The type is kept so past
// proposals that contain it still decode.
message MsgAddBlacklistAccounts {
  option deprecated = true;
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  repeated string blacklist_accounts = 2
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}

// MsgRemoveBlacklistAccounts is deprecated and can no longer be executed. Use
// MsgUnsanctionAddresses signed by the gov authority. The type is kept so past
// proposals that contain it still decode.
message MsgRemoveBlacklistAccounts {
  option deprecated = true;
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  repeated string blacklist_accounts = 2
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}

// MsgUpdateParams updates the module parameters. Authority must be the gov
// module account.
message MsgUpdateParams {
  option (amino.name) = "mantrachain/x/sanction/MsgUpdateParams";
  option (cosmos.msg.v1.signer) = "authority";

  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  Params params = 2
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// MsgUpdateParamsResponse defines the response type for MsgUpdateParams.
message MsgUpdateParamsResponse {}

// MsgUpdateSanctioners replaces the whole sanctioner list. Authority must be
// the gov module account. An empty list turns the fast path off.
message MsgUpdateSanctioners {
  option (amino.name) = "mantrachain/x/sanction/MsgUpdateSanctioners";
  option (cosmos.msg.v1.signer) = "authority";

  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  repeated Sanctioner sanctioners = 2 [ (gogoproto.nullable) = false ];
}

// MsgUpdateSanctionersResponse defines the response type for
// MsgUpdateSanctioners.
message MsgUpdateSanctionersResponse {}

// MsgSanctionAddresses adds addresses to the sanction list. Signer must be the
// gov authority or a sanctioner with any role. Governance isn't subject to the
// caps or the protected-address checks.
message MsgSanctionAddresses {
  option (amino.name) = "mantrachain/x/sanction/MsgSanctionAddresses";
  option (cosmos.msg.v1.signer) = "signer";

  string signer = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // addresses is capped by params.max_addresses_per_msg.
  repeated string addresses = 2
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // reason is emitted in the event and capped by params.max_reason_length.
  // Add-only sanctioners should include the detection rule and triggering tx
  // hash.
  string reason = 3;
}

// MsgSanctionAddressesResponse defines the response type for
// MsgSanctionAddresses.
message MsgSanctionAddressesResponse {}

// MsgUnsanctionAddresses removes addresses from the sanction list. Signer must
// be the gov authority or a full sanctioner. Either can remove any entry.
message MsgUnsanctionAddresses {
  option (amino.name) = "mantrachain/x/sanction/MsgUnsanctionAddresses";
  option (cosmos.msg.v1.signer) = "signer";

  string signer = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // addresses is capped by params.max_addresses_per_msg.
  repeated string addresses = 2
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string reason = 3;
}

// MsgUnsanctionAddressesResponse defines the response type for
// MsgUnsanctionAddresses.
message MsgUnsanctionAddressesResponse {}

// MsgRevokeSanctioner removes an add-only sanctioner from the sanctioner list.
// Signer must be a sanctioner with the full role. Only governance can add a
// sanctioner back.
message MsgRevokeSanctioner {
  option (amino.name) = "mantrachain/x/sanction/MsgRevokeSanctioner";
  option (cosmos.msg.v1.signer) = "signer";

  string signer = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string address = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string reason = 3;
}

// MsgRevokeSanctionerResponse defines the response type for
// MsgRevokeSanctioner.
message MsgRevokeSanctionerResponse {}
